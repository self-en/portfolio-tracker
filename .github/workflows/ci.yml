name: build
# Builds a per-branch image so every branch gets its own preview. The
# branch-previews ApplicationSet pins the immutable sha-<short> tag; the
# branch-slug tag is pushed too (informational, mirrors the platform convention).
on:
  push:
    branches: ["**"]

jobs:
  # Gate sui test PRIMA della build. La suite non richiede né database né rete (i
  # test di repo girano su pg-mem, quelli di dominio non hanno I/O, quelli live sono
  # opt-in dietro LIVE=1), quindi costa poco e impedisce che un'immagine rotta
  # raggiunga l'env di branch.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # --include=dev esplicito: se NODE_ENV=production fosse impostata nel runner,
      # npm salterebbe in silenzio pg-mem e vite, e i test fallirebbero con un
      # MODULE_NOT_FOUND che non spiega la causa.
      - run: npm ci --include=dev
      - run: npm run check:contract
      - run: npm run typecheck
      - run: npm test
      - run: ./scripts/check-no-console.sh

      # La build della SPA è parte del contratto: se non compila, l'immagine
      # verrebbe pubblicata senza frontend.
      - run: npm --prefix web ci --include=dev
      - run: npm --prefix web run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Compute tags
        id: meta
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Branch slug: lowercase, non-alphanumeric -> '-', trimmed. Matches
          # ArgoCD's slugify so the tag lines up with the preview's naming.
          slug=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # QEMU + Buildx: build a multi-arch image so previews run natively on both
      # amd64 (cloud VM) and arm64 (Apple Silicon Docker Desktop dev clusters).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # ghcr.io/<owner>/<repo>/<repo> - matches image.repository (ghcr.io/self-en/portfolio-tracker/portfolio-tracker)
          # that nedo fills into the chart at project-creation time.
          tags: |
            ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}:sha-${{ steps.meta.outputs.short }}
            ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}:${{ steps.meta.outputs.slug }}
