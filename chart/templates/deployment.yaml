apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Set to the per-commit sha by the ApplicationSet - forces a rollout on
        # every push even if image.tag somehow didn't change (belt-and-suspenders).
        self-en.local/commit-sha: {{ .Values.commitSha | quote }}
    spec:
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        {{- if (.Values.appEnv | default dict).encoded }}
        # self-en-app-env: variabili configurate dalla UI di nedo (vedi
        # app-env-secret.yaml). Il nome del Secret porta l'hash del contenuto,
        # cosi' un cambio di configurazione fa ripartire davvero i pod.
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-env-{{ (.Values.appEnv | default dict).encoded | sha256sum | trunc 10 }}
        {{- end }}
        # Always re-check the registry on (re)start so a new digest behind the
        # pinned tag is picked up.
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.containerPort }}
        {{- with .Values.resources }}
        # Il chart non impostava resource limit. yahoo-finance2 v4 tira dentro
        # @modelcontextprotocol/sdk, zod e tough-cookie come dipendenze RUNTIME,
        # quindi il footprint non è quello di un hello-world: meglio dichiarare
        # una richiesta esplicita che scoprire un OOMKill da default di namespace.
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: PORT
          value: {{ .Values.containerPort | quote }}
        - name: REPO_NAME
          value: {{ .Release.Name | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.app.logLevel | quote }}
        # APP_PASSWORD e SESSION_SECRET NON stanno più qui: arrivano dall'envFrom
        # sopra, cioè dalla pagina "Configurazione" del progetto in nedo (sono
        # dichiarate in self-en.json, con etichetta e pulsante "genera").
        # Erano due `env:` con secretKeyRef verso un Secret da creare a mano: se
        # fossero rimaste avrebbero VINTO su envFrom (in Kubernetes un `env:`
        # esplicito ha la precedenza), quindi i valori impostati dalla UI sarebbero
        # stati ignorati in silenzio. Il comportamento in assenza di valori non
        # cambia: nessun Secret ⇒ variabili assenti ⇒ "locked mode" (503
        # not_configured su /api/*, /healthz 200), non un crashloop.
        # Gli env di branch sono serviti su http:// semplice (httproute.yaml non ha
        # configurazione TLS) e un cookie Secure viene SCARTATO IN SILENZIO dal
        # browser: login 204, poi 401 su ogni richiesta, senza nulla nei log.
        # Passa a true il giorno in cui la piattaforma aggiunge TLS.
        - name: COOKIE_SECURE
          value: {{ .Values.app.cookieSecure | quote }}
        # Lo scheduler in-process elegge un leader con pg_try_advisory_lock, quindi
        # è corretto anche con replicaCount > 1.
        - name: SCHEDULER_ENABLED
          value: {{ .Values.app.schedulerEnabled | quote }}
        {{- if .Values.postgres.host }}
        # This branch's own database (created by the PreSync hook). Passed both as
        # a DATABASE_URL and as discrete PG* vars - the app prefers the discrete
        # vars, which avoid URL-encoding pitfalls in the generated password.
        - name: PGHOST
          value: {{ .Values.postgres.host | quote }}
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          value: {{ .Values.postgres.appUser | quote }}
        - name: PGPASSWORD
          value: {{ .Values.postgres.appPassword | quote }}
        - name: PGDATABASE
          value: {{ .Release.Name | replace "-" "_" | quote }}
        - name: DATABASE_URL
          value: "postgresql://{{ .Values.postgres.appUser }}:{{ .Values.postgres.appPassword }}@{{ .Values.postgres.host }}:5432/{{ .Release.Name | replace "-" "_" }}"
        {{- end }}
        {{- if .Values.otel.endpoint }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Release.Name | quote }}
        # otel.endpoint is Alloy's OTLP *HTTP* port (4318), so pin the protocol to
        # http/protobuf rather than rely on the SDK default (a future flip to grpc
        # would silently hit the wrong port). One endpoint carries all 3 signals;
        # Alloy fans them out to Tempo/Prometheus/Loki.
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        # Emit all three signals over OTLP. These are the SDK defaults today, set
        # explicitly so "traces + metrics + logs" is intent, not luck.
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        # Zero-code OpenTelemetry: preload the auto-instrumentation register hook
        # (added to package.json), which instruments express/pg/http and exports
        # traces + metrics + logs over OTLP to the endpoint above. Logs flow via
        # the pino instrumentation (the app logs through pino, see server.js) -
        # bare console.log is NOT bridged to OTLP. Gated on otel.endpoint (only the
        # `main` branch, per the ApplicationSet), so on every other branch
        # NODE_OPTIONS is unset, the SDK is never loaded, and nothing tries to
        # export to a missing collector.
        - name: NODE_OPTIONS
          value: "--require @opentelemetry/auto-instrumentations-node/register"
        {{- end }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.containerPort }}
          initialDelaySeconds: 3
          periodSeconds: 10
