{{/* self-en-contract: 1 - file gestito dalla piattaforma self-en, non modificare.
     Rende le variabili d'ambiente configurate dalla UI di nedo (pagina
     "Configurazione" del progetto) come Secret, consumato dal Deployment via
     envFrom. L'ApplicationSet passa UN solo parametro helm, `appEnv.encoded`:
     il base64 di un oggetto JSON {CHIAVE: valore}. E' codificato perche' il
     valore attraversa due livelli che lo interpreterebbero - il go-template
     dell'ApplicationSet (un `{{` letterale nel valore romperebbe il template) e
     l'escaping di `--set` di ArgoCD (virgole/backslash) - e il base64 standard
     non contiene nessuno dei due. Vuoto (nessuna variabile per questo branch) =
     nessun Secret.
     Il nome del Secret porta l'hash del contenuto: cambiare una variabile cambia
     il nome, quindi cambia il pod template del Deployment, quindi i pod
     ripartono davvero (con un nome fisso il Deployment resterebbe identico e i
     pod continuerebbero con i vecchi valori). Il Secret vecchio viene eliminato
     da ArgoCD alla sincronizzazione successiva.
     `.Values.appEnv | default dict` invece di .Values.appEnv.encoded diretto per
     non far fallire l'intero render se un chart perde la chiave da values.yaml
     (`dig` non funziona su .Values: e' un common.Values, non una map).
     Vedi la sezione sulla configurazione applicativa in CLAUDE.md di self-en/infra. */}}
{{- $encoded := (.Values.appEnv | default dict).encoded | default "" }}
{{- if $encoded }}
{{- $env := $encoded | b64dec | fromJson }}
{{- if $env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env-{{ $encoded | sha256sum | trunc 10 }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
{{- range $key, $value := $env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- end }}
